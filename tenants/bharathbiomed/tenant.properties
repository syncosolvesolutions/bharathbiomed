# Android build-time values for the "bharathbiomed" tenant — copied to
# android/tenant.properties by scripts/new_tenant.sh before running a build
# for this tenant (same directory as android/local.properties and
# android/key.properties — that's the Gradle root for the Android build).
# Mirrors tenants/bharathbiomed/tenant.json's androidApplicationId/appName;
# kept as a separate file (not read directly from the json) because
# android/app/build.gradle.kts only speaks java.util.Properties, not JSON.
# A per-tenant build also needs that tenant's own google-services.json
# alongside it — see the comment in android/app/build.gradle.kts.
